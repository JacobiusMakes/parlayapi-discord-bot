name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (stdlib only, no network)
        run: python -m unittest discover -s tests -v
      - name: Install bot dependencies
        run: pip install -r requirements.txt
      - name: Bot module imports and registers commands
        run: |
          python - <<'EOF'
          import bot
          names = sorted(c.name for c in bot.bot.tree.get_commands())
          assert names == ["line", "moves", "odds", "parlaycheck"], names
          print("commands OK:", names)
          EOF
